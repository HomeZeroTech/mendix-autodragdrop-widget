name: Release

# Pushing a tag v<version> builds the widget and attaches the .mpk to a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches the widget version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          grep -q "version=\"$version\"" src/package.xml || { echo "src/package.xml is not at $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag that was moved (a release redone before anyone used it) replaces the package of its release.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$VERSION/homezero.DragDrop.mpk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$VERSION/homezero.DragDrop.mpk" --title "$GITHUB_REF_NAME" --generate-notes
          fi
